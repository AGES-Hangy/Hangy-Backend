services:
  db:
    image: postgres:17-alpine
    env_file:
      - ../.env
    volumes:
      - hangy_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ..:/app
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      # Containers reach PostgreSQL through its Compose service name. Keeping
      # this override here also allows .env to use localhost for host commands.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-hangy}:${POSTGRES_PASSWORD:-hangy}@db:5432/${POSTGRES_DB:-hangy}
    depends_on:
      db:
        condition: service_healthy
    command: >-
      sh -c "alembic upgrade head &&
      python -m app.seed &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:8000/health', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  hangy_postgres_data:
